[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ec_tools_cli"
version = "0.1.5"
description = "A collection of tool cli for EC."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "cachetools>=5.3.3",
    "colorama>=0.4.6",
    "ec-tools>=3.3",
    "pillow>=12.1.0",
    "pyzbar>=0.1.9",
    "qrcode>=8.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit>=4.5.1",
    "pytest",
]

[project.scripts]
ec-enc = "ec_tools_cli.enc.cli:main"
ec-sql = "ec_tools_cli.db.cli:main"
ec-vault = "ec_tools_cli.vault.cli:main"
ec-backup = "ec_tools_cli.backup_machine.cli:main"
auto-run = "ec_tools_cli.auto_run.cli:main"
ec-qrcode = "ec_tools_cli.one_off.qr_code:main"

[tool.black]
line-length = 120

[dependency-groups]
dev = [
    "black",
    "pre-commit>=4.5.1",
    "pytest",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "test",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ec_tools_cli*"]
exclude = ["test*"]
